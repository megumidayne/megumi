```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Megumi Chi Tiêu</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f6f7fb;
    color: #333;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #ff70a3, #ff9abb);
    color: white;
    text-align: center;
    padding: 28px 15px;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    opacity: 0.9;
}

/* CONTAINER */
.container {
    max-width: 950px;
    margin: 25px auto;
    padding: 0 15px;
}

/* THỐNG KÊ */
.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    margin-bottom: 20px;
}

.summary .card {
    text-align: center;
}

.summary h3 {
    font-size: 15px;
    color: #777;
    margin-bottom: 10px;
}

.amount {
    font-size: 22px;
    font-weight: bold;
}

.income {
    color: #16a36a;
}

.expense {
    color: #ef5575;
}

.balance {
    color: #755bd8;
}

/* FORM */
h2 {
    margin-bottom: 15px;
}

input,
select,
button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border-radius: 10px;
    font-size: 16px;
}

input,
select {
    border: 1px solid #ddd;
    background: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #ff70a3;
}

button {
    border: none;
    background: #ff70a3;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff4f8c;
}

/* TÌM KIẾM */
.search {
    margin-bottom: 20px;
}

/* GIAO DỊCH */
.transaction {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.transaction:last-child {
    border-bottom: none;
}

.transaction-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.transaction-category {
    color: #888;
    font-size: 13px;
}

.transaction-right {
    text-align: right;
    white-space: nowrap;
}

.delete {
    width: auto;
    padding: 7px 12px;
    margin-top: 7px;
    background: #ff5757;
    font-size: 13px;
}

.empty {
    text-align: center;
    color: #999;
    padding: 25px;
}

/* MOBILE */
@media (max-width: 650px) {

    .summary {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 25px;
    }

    .transaction {
        align-items: flex-start;
    }

}
</style>
</head>

<body>

<header>
    <h1>🌸 Megumi Chi Tiêu</h1>
    <p>Quản lý chi tiêu cá nhân</p>
</header>

<div class="container">

    <!-- THỐNG KÊ -->
    <div class="summary">

        <div class="card">
            <h3>💰 Tổng thu</h3>
            <div id="totalIncome" class="amount income">
                0 ₫
            </div>
        </div>

        <div class="card">
            <h3>💸 Tổng chi</h3>
            <div id="totalExpense" class="amount expense">
                0 ₫
            </div>
        </div>

        <div class="card">
            <h3>💵 Số dư</h3>
            <div id="balance" class="amount balance">
                0 ₫
            </div>
        </div>

    </div>


    <!-- THÊM GIAO DỊCH -->
    <div class="card">

        <h2>➕ Thêm giao dịch</h2>

        <input
            type="text"
            id="name"
            placeholder="Tên giao dịch, VD: Ăn sáng"
        >

        <input
            type="number"
            id="money"
            placeholder="Số tiền, VD: 15600"
            min="0"
        >

        <select id="type">

            <option value="expense">
                💸 Khoản chi
            </option>

            <option value="income">
                💰 Khoản thu
            </option>

        </select>

        <select id="category">

            <option>🍜 Ăn uống</option>
            <option>🚗 Đi lại</option>
            <option>🛍️ Mua sắm</option>
            <option>📚 Học tập</option>
            <option>🏠 Nhà ở</option>
            <option>🎮 Giải trí</option>
            <option>💼 Công việc</option>
            <option>📦 Khác</option>

        </select>

        <button onclick="addTransaction()">
            Thêm giao dịch
        </button>

    </div>


    <!-- TÌM KIẾM -->
    <div class="card">

        <h2>🔎 Tìm kiếm</h2>

        <input
            type="text"
            id="search"
            placeholder="Tìm giao dịch..."
            oninput="displayTransactions()"
        >

    </div>


    <!-- LỊCH SỬ -->
    <div class="card">

        <h2>📋 Lịch sử giao dịch</h2>

        <div id="transactionList"></div>

    </div>

</div>


<script>

/* LẤY DỮ LIỆU ĐÃ LƯU */

let transactions =
    JSON.parse(
        localStorage.getItem("megumiTransactions")
    ) || [];


/* ĐỊNH DẠNG TIỀN */

function formatMoney(number) {

    return Number(number)
        .toLocaleString("vi-VN") + " ₫";

}


/* LƯU DỮ LIỆU */

function saveData() {

    localStorage.setItem(
        "megumiTransactions",
        JSON.stringify(transactions)
    );

}


/* THÊM GIAO DỊCH */

function addTransaction() {

    const name =
        document.getElementById("name")
        .value
        .trim();

    const money =
        Number(
            document.getElementById("money")
            .value
        );

    const type =
        document.getElementById("type")
        .value;

    const category =
        document.getElementById("category")
        .value;


    if (name === "" || money <= 0) {

        alert(
            "Vui lòng nhập tên giao dịch và số tiền!"
        );

        return;

    }


    transactions.push({

        id: Date.now(),

        name: name,

        money: money,

        type: type,

        category: category

    });


    saveData();


    document.getElementById("name")
        .value = "";

    document.getElementById("money")
        .value = "";


    displayTransactions();

}


/* XÓA */

function deleteTransaction(id) {

    transactions =
        transactions.filter(
            item => item.id !== id
        );


    saveData();

    displayTransactions();

}


/* HIỂN THỊ */

function displayTransactions() {

    const list =
        document.getElementById(
            "transactionList"
        );


    const search =
        document.getElementById("search")
        .value
        .toLowerCase();


    list.innerHTML = "";


    let totalIncome = 0;

    let totalExpense = 0;


    const filtered =
        transactions.filter(item =>

            item.name
                .toLowerCase()
                .includes(search)

            ||

            item.category
                .toLowerCase()
                .includes(search)

        );


    if (filtered.length === 0) {

        list.innerHTML =
            '<div class="empty">Chưa có giao dịch.</div>';

    }


    filtered.forEach(item => {


        if (item.type === "income") {

            totalIncome += item.money;

        } else {

            totalExpense += item.money;

        }


        const transaction =
            document.createElement("div");


        transaction.className =
            "transaction";


        const sign =
            item.type === "income"
            ? "+"
            : "-";


        const color =
            item.type === "income"
            ? "#16a36a"
            : "#ef5575";


        transaction.innerHTML = `

            <div>

                <div class="transaction-name">
                    ${item.name}
                </div>

                <div class="transaction-category">
                    ${item.category}
                </div>

            </div>


            <div class="transaction-right">

                <strong style="color:${color}">
                    ${sign}${formatMoney(item.money)}
                </strong>

                <br>

                <button
                    class="delete"
                    onclick="deleteTransaction(${item.id})"
                >
                    Xóa
                </button>

            </div>

        `;


        list.appendChild(transaction);

    });


    const balance =
        totalIncome - totalExpense;


    document.getElementById(
        "totalIncome"
    ).textContent =
        formatMoney(totalIncome);


    document.getElementById(
        "totalExpense"
    ).textContent =
        formatMoney(totalExpense);


    document.getElementById(
        "balance"
    ).textContent =
        formatMoney(balance);

}


/* CHẠY */

displayTransactions();

</script>

</body>
</html>
```
